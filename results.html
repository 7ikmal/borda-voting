<!doctype html>
<button id="export-raw" class="btn btn-outline">Export Raw Votes CSV</button>
<button id="reset-data" class="btn btn-danger">Reset Data</button>
</section>


<div id="toast" class="toast" role="status" aria-live="polite"></div>
</main>


<script src="/js/config.js"></script>
<script src="/js/storage.js"></script>
<script src="/js/borda.js"></script>
<script src="/js/charts.js"></script>
<script src="/js/ui.js"></script>
<script>
// compute results
const votes = storage.getAllVotes();
const k = CANDIDATES.length;
const result = computeBordaResults(votes, { scoring: SCORING });


// render table
const tableRoot = document.getElementById('summary-table');
tableRoot.innerHTML = renderSummaryTable(result.totals, result.ranking);


// render matrix
document.getElementById('matrix').innerHTML = renderMatrix(result.matrix);


// chart
renderBarChart('barChart', result.totals, CANDIDATES);


// export
document.getElementById('export-csv').addEventListener('click', ()=>{
const csv = exportTotalsCsv(result.totals);
downloadFile(csv, 'borda_totals.csv');
});
document.getElementById('export-raw').addEventListener('click', ()=>{
const csv = storage.exportRawCsv();
downloadFile(csv, 'borda_raw_votes.csv');
});


// reset
document.getElementById('reset-data').addEventListener('click', ()=>{
if(!confirm('Hapus semua data suara? Tindakan ini tidak dapat dibatalkan.')) return;
storage.reset();
showToast('Data direset. Muat ulang halaman untuk melihat perubahan.');
});


// small render helper functions provided by borda.js/ui.js/charts.js
</script>
</body>
</html>
